# One command runs the whole stack:   docker compose up --build
#   api     FastAPI app + web UI          http://localhost:8000
#   qdrant  vector DB (server mode)       http://localhost:6333/dashboard
#   ollama  local LLM for answers (CPU)
# Sized for an 8 GB laptop: the stack uses roughly 2.5 GB RAM in total.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      VECTOR_DB: qdrant
      QDRANT_URL: http://qdrant:6333        # same adapter as embedded mode, now talking to a server
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      SQLITE_PATH: /app/data/documents.db
      MAX_UPLOAD_MB: 100
    volumes:
      - api-data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"                          # REST API + web dashboard
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.33.3
    environment:
      OLLAMA_KEEP_ALIVE: 30m                 # keep the model loaded between questions
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # One-shot job: download the LLM into the ollama volume (only the first time, ~1 GB).
  ollama-pull:
    image: ollama/ollama:0.33.3
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${LLM_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      - ollama
    restart: "no"

volumes:
  api-data:
  qdrant-data:
  ollama-models:
